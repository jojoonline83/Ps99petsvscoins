name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/clan-battle-leaderboard-ghchnh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout gh-pages
          git checkout ${{ github.sha }} -- index.html players.html style.css app.js players.js .nojekyll .github/scripts/snapshot.mjs .github/workflows/snapshot.yml .github/workflows/deploy.yml
          git add -A
          git diff --cached --quiet && echo "No changes to deploy" && exit 0
          git commit -m "deploy: sync from ${{ github.ref_name }}"
          git push origin gh-pages
