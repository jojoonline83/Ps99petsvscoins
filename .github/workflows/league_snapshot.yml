name: Snapshot League Data

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    concurrency:
      group: league-snapshot
      cancel-in-progress: false
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Take snapshot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          node .github/scripts/league_snapshot.mjs
          node .github/scripts/discord_alert.mjs || echo "::warning::Discord alert failed"

          git add league_history.json resolved_names.json alert_state.json
          git diff --cached --quiet && echo "No changes" && exit 0

          for attempt in 1 2 3; do
            git commit -m "chore: snapshot league data" && git push && exit 0
            echo "Push rejected — retrying"
            git reset --hard HEAD~1
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            node .github/scripts/league_snapshot.mjs
            node .github/scripts/discord_alert.mjs || true
            git add league_history.json resolved_names.json alert_state.json
            git diff --cached --quiet && echo "No changes after retry" && exit 0
          done
          echo "::warning::Snapshot push failed after retries"
