name: Snapshot League Data

on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send test alert to Discord webhooks'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  snapshot:
    if: false
    runs-on: ubuntu-latest
    concurrency:
      group: league-snapshot
      cancel-in-progress: true
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Send test alert
        if: inputs.test_alert == true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_WINTHEASURA: ${{ secrets.DISCORD_WEBHOOK_WINTHEASURA }}
        run: |
          send_test() {
            local url="$1" name="$2"
            [ -z "$url" ] && echo "No webhook for $name — skipping" && return
            curl -s -o /dev/null -w "  $name: HTTP %{http_code}\n" -X POST "$url" \
              -H "Content-Type: application/json" \
              -d "{\"embeds\":[{\"title\":\"✅ Test Alert\",\"description\":\"Discord webhook **$name** is working!\",\"color\":3066993,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"footer\":{\"text\":\"PS99 League Tracker — TEST\"}}]}"
          }
          echo "Sending test alerts…"
          send_test "$DISCORD_WEBHOOK" "main"
          send_test "$DISCORD_WEBHOOK_WINTHEASURA" "wintheasura"
          echo "Done."

      - name: Take snapshot
        if: inputs.test_alert != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          node .github/scripts/league_snapshot.mjs

          git add league_history.json resolved_names.json alert_state.json
          git diff --cached --quiet && echo "No changes" && exit 0

          for attempt in 1 2 3; do
            git commit -m "chore: snapshot league data" && git push && exit 0
            echo "Push rejected — retrying"
            git reset --hard HEAD~1
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            node .github/scripts/league_snapshot.mjs
            git add league_history.json resolved_names.json alert_state.json
            git diff --cached --quiet && echo "No changes after retry" && exit 0
          done
          echo "::warning::Snapshot push failed after retries"
