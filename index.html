<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS99 Clan Battle Leaderboard</title>
<style>
  :root {
    --ground: #0b0d1a;
    --surface: #121524;
    --raised: #1a1d30;
    --raised-alt: #16192b;
    --border: #252847;
    --border-light: #2e3158;
    --text: #e6e4ef;
    --text2: #6b6e94;
    --text3: #4a4d6e;
    --accent: #e4a22b;
    --accent-dim: #b8841f;
    --positive: #34d399;
    --positive-bg: rgba(52,211,153,0.08);
    --negative: #f87171;
    --negative-bg: rgba(248,113,113,0.08);
    --gold: #f5c842;
    --gold-bg: rgba(245,200,66,0.06);
    --silver: #94a3b8;
    --silver-bg: rgba(148,163,184,0.06);
    --bronze: #cd7f32;
    --bronze-bg: rgba(205,127,50,0.06);
  }

  :root[data-theme="light"] {
    --ground: #f0eff5;
    --surface: #ffffff;
    --raised: #f7f6fb;
    --raised-alt: #f2f1f7;
    --border: #d8d6e3;
    --border-light: #e4e2ed;
    --text: #1a1830;
    --text2: #6e6b88;
    --text3: #9895ad;
    --accent: #c48a1a;
    --accent-dim: #a06f0e;
    --positive: #16a36a;
    --positive-bg: rgba(22,163,106,0.07);
    --negative: #dc3545;
    --negative-bg: rgba(220,53,69,0.07);
    --gold: #b8940a;
    --gold-bg: rgba(184,148,10,0.06);
    --silver: #5a6a7e;
    --silver-bg: rgba(90,106,126,0.05);
    --bronze: #9e5e1a;
    --bronze-bg: rgba(158,94,26,0.05);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground: #f0eff5;
      --surface: #ffffff;
      --raised: #f7f6fb;
      --raised-alt: #f2f1f7;
      --border: #d8d6e3;
      --border-light: #e4e2ed;
      --text: #1a1830;
      --text2: #6e6b88;
      --text3: #9895ad;
      --accent: #c48a1a;
      --accent-dim: #a06f0e;
      --positive: #16a36a;
      --positive-bg: rgba(22,163,106,0.07);
      --negative: #dc3545;
      --negative-bg: rgba(220,53,69,0.07);
      --gold: #b8940a;
      --gold-bg: rgba(184,148,10,0.06);
      --silver: #5a6a7e;
      --silver-bg: rgba(90,106,126,0.05);
      --bronze: #9e5e1a;
      --bronze-bg: rgba(158,94,26,0.05);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--ground);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  .mono {
    font-family: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ── Status bar ── */
  .status-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 48px;
    gap: 16px;
  }

  .status-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .logo-mark {
    font-weight: 800;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .divider-v {
    width: 1px;
    height: 20px;
    background: var(--border);
    flex-shrink: 0;
  }

  .battle-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .battle-tag .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--positive);
    flex-shrink: 0;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .battle-tag .name {
    color: var(--text);
    font-weight: 600;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    font-size: 0.78rem;
    color: var(--text2);
  }

  .countdown-label {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .countdown-val {
    color: var(--accent);
    font-weight: 600;
  }

  .update-time { color: var(--text3); }

  .fetch-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    color: var(--text2);
  }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 1.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main container ── */
  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }

  /* ── Column headers ── */
  .col-head {
    display: grid;
    grid-template-columns: 44px 1fr 130px 96px 96px 96px 28px;
    align-items: center;
    padding: 10px 14px;
    gap: 6px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
  }

  .col-head span:nth-child(n+3) { text-align: right; }

  /* ── Clan rows ── */
  .clan-row {
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .clan-row:nth-child(even) { background: var(--raised-alt); }

  .clan-row::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: transparent;
  }

  .clan-row.rank-1 { background: var(--gold-bg); }
  .clan-row.rank-1::before { background: var(--gold); }
  .clan-row.rank-2 { background: var(--silver-bg); }
  .clan-row.rank-2::before { background: var(--silver); }
  .clan-row.rank-3 { background: var(--bronze-bg); }
  .clan-row.rank-3::before { background: var(--bronze); }

  .clan-head {
    display: grid;
    grid-template-columns: 44px 1fr 130px 96px 96px 96px 28px;
    align-items: center;
    padding: 10px 14px;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
  }

  .clan-head:hover { background: rgba(255,255,255,0.02); }

  .rank-num {
    font-weight: 700;
    font-size: 0.92rem;
    text-align: center;
    color: var(--text2);
  }

  .rank-1 .rank-num { color: var(--gold); }
  .rank-2 .rank-num { color: var(--silver); }
  .rank-3 .rank-num { color: var(--bronze); }

  .c-name {
    font-weight: 600;
    font-size: 0.88rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .c-name .cnt {
    color: var(--text3);
    font-weight: 400;
    font-size: 0.75rem;
    margin-left: 6px;
  }

  .c-score {
    text-align: right;
    font-weight: 700;
    font-size: 0.88rem;
  }

  .c-delta {
    text-align: right;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .c-delta.up { color: var(--positive); }
  .c-delta.down { color: var(--negative); }
  .c-delta.flat { color: var(--text3); }

  .arrow {
    text-align: center;
    color: var(--text3);
    font-size: 0.6rem;
    transition: transform 0.15s;
    line-height: 1;
  }

  .clan-row.open .arrow { transform: rotate(180deg); }

  /* ── Member panel ── */
  .member-panel {
    display: none;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0 14px 8px 14px;
    max-height: 420px;
    overflow-y: auto;
  }

  .clan-row.open .member-panel { display: block; }

  .m-head {
    display: grid;
    grid-template-columns: 32px 1fr 110px 86px 86px 86px;
    padding: 8px 4px 6px;
    gap: 6px;
    font-size: 0.64rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }

  .m-head span:nth-child(n+3) { text-align: right; }

  .m-row {
    display: grid;
    grid-template-columns: 32px 1fr 110px 86px 86px 86px;
    align-items: center;
    padding: 5px 4px;
    gap: 6px;
    font-size: 0.8rem;
    border-bottom: 1px solid var(--border);
  }

  .m-row:last-child { border-bottom: none; }
  .m-row:nth-child(even) { background: var(--raised-alt); }

  .m-rank {
    text-align: center;
    color: var(--text3);
    font-size: 0.72rem;
  }

  .m-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
  }

  .m-score {
    text-align: right;
    font-weight: 600;
  }

  .m-delta {
    text-align: right;
    font-size: 0.78rem;
    font-weight: 500;
  }

  .m-delta.up { color: var(--positive); }
  .m-delta.down { color: var(--negative); }
  .m-delta.flat { color: var(--text3); }

  /* ── Loading / Error ── */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px 20px;
    gap: 14px;
    color: var(--text2);
  }

  .loading-state .spinner {
    width: 24px;
    height: 24px;
    border-width: 2px;
  }

  .error-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--negative);
    font-size: 0.9rem;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 0 20px 24px;
    font-size: 0.7rem;
    color: var(--text3);
    letter-spacing: 0.02em;
  }

  /* ── Responsive ── */
  @media (max-width: 820px) {
    .col-head, .clan-head {
      grid-template-columns: 36px 1fr 100px 76px 76px 76px 24px;
      padding: 8px 10px;
      font-size: 0.76rem;
    }
    .col-head { font-size: 0.64rem; }
    .c-name { font-size: 0.82rem; }
    .c-score { font-size: 0.82rem; }
    .c-delta { font-size: 0.76rem; }
    .m-head, .m-row {
      grid-template-columns: 28px 1fr 90px 70px 70px 70px;
      font-size: 0.76rem;
    }
    .m-head { font-size: 0.6rem; }
  }

  @media (max-width: 600px) {
    .status-bar { padding: 0 12px; height: 42px; gap: 10px; }
    .logo-mark { font-size: 0.72rem; }
    .divider-v { display: none; }
    .battle-tag { display: none; }
    .status-right .update-time { display: none; }

    .container { padding: 10px 8px 50px; }

    .col-head, .clan-head {
      grid-template-columns: 32px 1fr 80px 64px 24px;
      padding: 7px 8px;
      gap: 4px;
    }
    .col-head .h-d30, .col-head .h-d60,
    .clan-head .c-d30, .clan-head .c-d60 { display: none; }

    .c-name { font-size: 0.78rem; }
    .c-score { font-size: 0.78rem; }
    .c-delta { font-size: 0.72rem; }

    .m-head, .m-row {
      grid-template-columns: 26px 1fr 74px 58px;
      gap: 4px;
    }
    .m-head .mh-d30, .m-head .mh-d60,
    .m-row .md-30, .m-row .md-60 { display: none; }
    .m-head { font-size: 0.58rem; }
    .m-row { font-size: 0.74rem; }
  }
</style>
</head>
<body>

<div class="status-bar">
  <div class="status-left">
    <div class="logo-mark">PS99 Clan Battle</div>
    <div class="divider-v"></div>
    <div class="battle-tag">
      <span class="live-dot"></span>
      <span id="battleName" class="name">Loading&hellip;</span>
    </div>
  </div>
  <div class="status-right">
    <div class="fetch-status" id="fetchStatus"></div>
    <div class="countdown-label mono">
      <span id="countdown" class="countdown-val">--:--</span>
    </div>
    <div class="update-time mono" id="lastUpdate"></div>
  </div>
</div>

<div class="container">
  <div class="col-head">
    <span>#</span>
    <span>Clan</span>
    <span>Score</span>
    <span>&#916; 10m</span>
    <span class="h-d30">&#916; 30m</span>
    <span class="h-d60">&#916; 1h</span>
    <span></span>
  </div>
  <div id="leaderboard">
    <div class="loading-state">
      <div class="spinner"></div>
      <span>Loading clan battle data&hellip;</span>
    </div>
  </div>
</div>

<div class="footer">
  Data from PS99 Big Games API &middot; Refreshes every 10 min &middot; Deltas track 10 m / 30 m / 1 h
</div>

<script>
const API = "https://ps99.biggamesapi.io/api";
const ROBLOX_API = "https://users.roblox.com/v1/users";
const INTERVAL = 10 * 60 * 1000;
const MAX = 100;

let snaps = [];
let names = new Map();
let cdTimer = null;
let nextAt = 0;

function fmt(n) {
  if (n == null || isNaN(n)) return "0";
  if (n >= 1e15) return (n / 1e15).toFixed(2) + "Q";
  if (n >= 1e12) return (n / 1e12).toFixed(2) + "T";
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return n.toLocaleString();
}

function fmtD(v) {
  if (v == null) return { t: "—", c: "flat" };
  if (v > 0) return { t: "+" + fmt(v), c: "up" };
  if (v < 0) return { t: "−" + fmt(Math.abs(v)), c: "down" };
  return { t: "0", c: "flat" };
}

function first(...a) {
  for (const x of a) if (x !== undefined && x !== null) return x;
}

function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }

async function api(url) {
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

async function getBattle() {
  try {
    const j = await api(`${API}/activeClanBattle`);
    const d = j?.data;
    return d ? { id: d?.configName || d?.ConfigName || d?._id || "Unknown",
                 name: d?.configName || d?.ConfigName || "Clan Battle" } : null;
  } catch { return null; }
}

async function getClans() {
  const out = [];
  const ps = 50;
  for (let p = 1; p <= Math.ceil(MAX / ps); p++) {
    try {
      const j = await api(`${API}/clans?page=${p}&pageSize=${ps}&sort=Points&sortOrder=desc`);
      const d = Array.isArray(j?.data) ? j.data : [];
      if (!d.length) break;
      for (const r of d) {
        out.push({
          name: first(r?.Name, r?.name, r?.ClanName, r?.clanName) || "?",
          points: num(first(r?.Points, r?.points, r?.Score, r?.score, r?.Total, r?.total)),
          memberCount: num(first(r?.Members, r?.members, r?.MemberCount, r?.memberCount))
        });
        if (out.length >= MAX) break;
      }
      if (out.length >= MAX) break;
    } catch { break; }
  }
  return out;
}

async function getClan(n) {
  try {
    const j = await api(`${API}/clan/${encodeURIComponent(n)}`);
    return j?.data || null;
  } catch { return null; }
}

function extractMembers(cd, bn) {
  const mems = Array.isArray(cd?.Members) ? cd.Members : [];
  const battles = cd?.Battles || cd?.battles || {};
  let bd = null;
  if (bn && battles[bn]) bd = battles[bn];
  else { const k = Object.keys(battles); if (k.length) bd = battles[k[k.length - 1]]; }

  let rows = [];
  if (bd) {
    rows = first(bd?.PointContributions, bd?.pointContributions,
      bd?.Contributions, bd?.contributions,
      bd?.Contribution, bd?.contribution) || [];
    if (!Array.isArray(rows)) rows = [];
  }
  if (!rows.length) {
    const fb = first(cd?.Contribution?.Battle, cd?.contribution?.battle,
      cd?.Contributions?.Battle, cd?.contributions?.battle);
    if (Array.isArray(fb)) rows = fb;
  }

  const pm = new Map();
  for (const r of rows) {
    const uid = num(first(r?.UserID, r?.UserId, r?.user_id, r?.userId, r?.id));
    const pts = num(first(r?.Points, r?.points, r?.TotalPoints, r?.total_points, r?.Score, r?.score, r?.Value, r?.value));
    if (uid > 0) pm.set(uid, pts);
  }

  const out = [];
  const seen = new Set();
  for (const m of mems) {
    const uid = num(first(m?.UserID, m?.UserId, m?.user_id, m?.userId, m?.id));
    if (uid <= 0) continue;
    seen.add(uid);
    out.push({ userId: uid, points: pm.get(uid) || 0 });
  }
  for (const [uid, pts] of pm) {
    if (!seen.has(uid)) out.push({ userId: uid, points: pts });
  }
  out.sort((a, b) => b.points - a.points);
  return out;
}

async function resolveNames(ids) {
  const need = ids.filter(id => !names.has(id));
  if (!need.length) return;
  for (let i = 0; i < need.length; i += 100) {
    const batch = need.slice(i, i + 100);
    try {
      const r = await fetch(ROBLOX_API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userIds: batch, excludeBannedUsers: false })
      });
      if (r.ok) {
        const j = await r.json();
        for (const u of (j?.data || []))
          names.set(u.id, u?.displayName || u?.name || `User_${u.id}`);
      }
    } catch {}
    for (const id of batch) if (!names.has(id)) names.set(id, `User_${id}`);
  }
}

function findSnap(mins) {
  if (snaps.length < 2) return null;
  const t = Date.now() - mins * 60000;
  let best = null, bd = Infinity;
  for (const s of snaps) { const d = Math.abs(s.t - t); if (d < bd) { bd = d; best = s; } }
  return bd > mins * 60000 * 0.5 ? null : best;
}

function clanDelta(pts, name, mins) {
  const s = findSnap(mins);
  if (!s) return null;
  const o = s.clans.find(c => c.n === name);
  return o ? pts - o.p : null;
}

function memDelta(pts, cname, uid, mins) {
  const s = findSnap(mins);
  if (!s) return null;
  const c = s.clans.find(c => c.n === cname);
  if (!c?.m) return null;
  const o = c.m.find(x => x.u === uid);
  return o ? pts - o.p : null;
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function toggle(i) {
  const r = document.querySelector(`.clan-row[data-i="${i}"]`);
  if (r) r.classList.toggle("open");
}

async function load() {
  const fs = document.getElementById("fetchStatus");
  fs.innerHTML = '<span class="spinner"></span> Fetching&hellip;';

  const battle = await getBattle();
  document.getElementById("battleName").textContent = battle?.name || "Unknown";

  const top = await getClans();
  if (!top.length) { fs.textContent = "No data"; return null; }

  const full = [];
  for (let i = 0; i < top.length; i += 5) {
    const batch = top.slice(i, i + 5);
    const dets = await Promise.all(batch.map(c => getClan(c.name)));
    for (let j = 0; j < batch.length; j++) {
      const c = batch[j];
      full.push({
        name: c.name, points: c.points, memberCount: c.memberCount,
        members: dets[j] ? extractMembers(dets[j], battle?.id) : []
      });
    }
    fs.innerHTML = `<span class="spinner"></span> ${Math.min(i + 5, top.length)}/${top.length}`;
  }

  const uids = full.flatMap(c => c.members.map(m => m.userId));
  if (uids.length) {
    fs.innerHTML = `<span class="spinner"></span> Names&hellip;`;
    await resolveNames(uids);
  }

  snaps.push({
    t: Date.now(),
    clans: full.map(c => ({
      n: c.name, p: c.points,
      m: c.members.map(m => ({ u: m.userId, p: m.points }))
    }))
  });
  snaps = snaps.filter(s => s.t >= Date.now() - 70 * 60000);

  fs.textContent = "";
  return full;
}

function render(clans) {
  const el = document.getElementById("leaderboard");
  if (!clans?.length) {
    el.innerHTML = '<div class="error-state">No clan data available.</div>';
    return;
  }

  let h = "";
  for (let i = 0; i < clans.length; i++) {
    const c = clans[i];
    const rk = i + 1;
    const d10 = fmtD(clanDelta(c.points, c.name, 10));
    const d30 = fmtD(clanDelta(c.points, c.name, 30));
    const d60 = fmtD(clanDelta(c.points, c.name, 60));
    const rc = rk <= 3 ? ` rank-${rk}` : "";

    h += `<div class="clan-row${rc}" data-i="${i}">`;
    h += `<div class="clan-head" onclick="toggle(${i})">`;
    h += `<div class="rank-num">${rk}</div>`;
    h += `<div class="c-name">${esc(c.name)}<span class="cnt">${c.members.length}</span></div>`;
    h += `<div class="c-score mono">${fmt(c.points)}</div>`;
    h += `<div class="c-delta mono ${d10.c}">${d10.t}</div>`;
    h += `<div class="c-delta c-d30 mono ${d30.c}">${d30.t}</div>`;
    h += `<div class="c-delta c-d60 mono ${d60.c}">${d60.t}</div>`;
    h += `<div class="arrow">&#9660;</div>`;
    h += `</div>`;

    h += `<div class="member-panel">`;
    h += `<div class="m-head"><span>#</span><span>Member</span><span>Score</span>`;
    h += `<span>&#916; 10m</span><span class="mh-d30">&#916; 30m</span><span class="mh-d60">&#916; 1h</span></div>`;

    for (let mi = 0; mi < c.members.length; mi++) {
      const m = c.members[mi];
      const mn = names.get(m.userId) || `User_${m.userId}`;
      const md1 = fmtD(memDelta(m.points, c.name, m.userId, 10));
      const md3 = fmtD(memDelta(m.points, c.name, m.userId, 30));
      const md6 = fmtD(memDelta(m.points, c.name, m.userId, 60));

      h += `<div class="m-row">`;
      h += `<div class="m-rank">${mi + 1}</div>`;
      h += `<div class="m-name">${esc(mn)}</div>`;
      h += `<div class="m-score mono">${fmt(m.points)}</div>`;
      h += `<div class="m-delta mono ${md1.c}">${md1.t}</div>`;
      h += `<div class="m-delta md-30 mono ${md3.c}">${md3.t}</div>`;
      h += `<div class="m-delta md-60 mono ${md6.c}">${md6.t}</div>`;
      h += `</div>`;
    }
    h += `</div></div>`;
  }
  el.innerHTML = h;
}

function tickCD() {
  const r = Math.max(0, nextAt - Date.now());
  const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
  document.getElementById("countdown").textContent =
    `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

async function refresh() {
  const data = await load();
  if (data) {
    render(data);
    document.getElementById("lastUpdate").textContent =
      new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  nextAt = Date.now() + INTERVAL;
  if (cdTimer) clearInterval(cdTimer);
  cdTimer = setInterval(tickCD, 1000);
  tickCD();
}

refresh();
setInterval(refresh, INTERVAL);
</script>
</body>
</html>
